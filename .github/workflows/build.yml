name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p intertitle-core
      - name: Build installer
        run: npx tauri build
      - name: Package CLI
        shell: pwsh
        run: Compress-Archive -Path src-tauri/target/release/intertitle-cli.exe -DestinationPath src-tauri/target/release/intertitle-cli-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: intertitle-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/intertitle-cli-windows-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/intertitle-cli-windows-x64.zip
          generate_release_notes: true
