[package]
name = "intertitle-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Core logic for Intertitle: probing, keyframes, timeline mapping, subtitle retiming and card encoding"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "fs", "sync"] }
base64 = "0.22"

[[bin]]
name = "intertitle-cli"
path = "src/bin/cli.rs"
