[package]
name = "intertitle"
version = "0.1.0"
description = "Cut scenes, mute lines and drop in title cards without re-encoding your movie."
authors = ["Lee Maskell"]
license = "MIT"
repository = "https://github.com/leecyrille/intertitle"
edition = "2021"
rust-version = "1.77"

[lib]
name = "intertitle_lib"
crate-type = ["rlib"]

[workspace]
members = ["core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
intertitle-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "fs", "sync"] }
base64 = "0.22"
regex = "1"
chrono = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
