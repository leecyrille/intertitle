name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

# One installer per platform plus the bare command-line binary.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            tauri_args: "--bundles nsis"
            cli_src: intertitle-cli.exe
            cli_out: intertitle-cli-windows.exe
          - os: macos-latest
            name: macos
            tauri_args: "--bundles dmg --target universal-apple-darwin"
            cli_src: intertitle-cli
            cli_out: intertitle-cli-macos
          - os: ubuntu-22.04
            name: linux
            tauri_args: "--bundles deb"
            cli_src: intertitle-cli
            cli_out: intertitle-cli-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p intertitle-core
      - name: Build app
        run: npx tauri build ${{ matrix.tauri_args }}
      - name: Build CLI
        run: cargo build --release --manifest-path src-tauri/Cargo.toml -p intertitle-core --bin intertitle-cli
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/${{ matrix.cli_src }} out/${{ matrix.cli_out }}
          find src-tauri/target -path '*/bundle/*' \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' \) -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: intertitle-${{ matrix.name }}
          path: out/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
